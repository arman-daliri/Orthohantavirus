name: hanta_phylo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11
  - pandas>=2.3
  - numpy>=2.4
  - biopython>=1.87
  - dendropy>=5.0
  - mafft=7.525
  - iqtree=3.1.3
  # Exact pin required: RNAcofold's reported free energies (dG) are dependent on the
  # ViennaRNA version's energy-parameter set, so an unpinned version would silently
  # change every downstream Reassortment Plausibility Index score. This pin could not
  # be reconciled against a real environment build in the authoring environment (no
  # conda/mamba/micromamba available, no network access to resolve or verify it).
  # NOTHING IN THE PIPELINE CALLS RNAcofold YET: boltzmann_compatibility and
  # rnacofold_dg are implemented and unit-tested, but the production call site holds
  # M_pack at 1.0 (see the README's RPI limitations, item 8). The pin is here so the
  # dependency lands with its rationale rather than being added ad hoc later; the first
  # real build must confirm bioconda actually serves 2.7.2 and that rnacofold_dg's
  # stdout regex matches this version's output.
  - viennarna=2.7.2
