name: hanta_phylo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11
  - pandas>=2.3
  - numpy>=2.4
  - biopython>=1.87
  - dendropy>=5.0
  # Figure rendering only (docs/superpowers/specs -- the before/after tanglegram
  # figures over Stage 2's committed trees). Not on the scored RPI path: no RPI
  # factor, gate, or verdict imports matplotlib.
  - matplotlib>=3.9
  # THIS FILE DESCRIBES THE LINUX/CONDA MACHINE ONLY. The Windows machine runs on the
  # system interpreter with manually pinned binaries -- see requirements-pip.txt and
  # tools/VERSIONS.txt. EnvironmentReconciliationTest asserts the two do not contradict.
  #
  # MAFFT VERSION SPLIT (design doc D14): 7.525 here, 7.526 on Windows. Not a choice --
  # MAFFT publishes no 7.525 Windows build and no 7.526 source release, so no single
  # version is obtainable on both. Cross-machine MAFFT agreement is therefore asserted
  # at alignment-content level by the reproducibility fixture, not by byte-identity.
  - mafft=7.525
  # iqtree 3.1.3 on conda. On Windows this comes from github.com/iqtree/iqtree3 (NOT
  # iqtree2, which has no 3.x release), and the executable there is named iqtree3.exe.
  - iqtree=3.1.3
  # Exact pin required: cofold free energies (dG) are dependent on the ViennaRNA
  # version's energy-parameter set, so an unpinned version would silently change every
  # downstream Reassortment Plausibility Index score.
  #
  # RESOLVED 2026-08-29 (was: "could not be reconciled against a real environment
  # build"). ViennaRNA 2.7.2 is installed and exercised on the Windows machine via the
  # PYTHON BINDINGS, which is now the production mechanism (design doc D2b) -- the pip
  # package ships no RNAcofold executable, and the subprocess/CLI path has been removed
  # from the codebase rather than left as a divergent second mechanism. The stdout regex
  # that this comment used to flag no longer exists.
  #
  # STILL OPEN for this file specifically: whether bioconda serves 2.7.2 on Linux has
  # not been checked -- that machine is not yet provisioned. M_pack also still holds at
  # 1.0 at the production call site until WS3.3 lands.
  - viennarna=2.7.2
